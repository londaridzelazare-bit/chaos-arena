<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Egg Defense – prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --edge:#1E2A38; --panel:#FFFFFF; --text:#1E2A38; --muted:#5B6776;
  --blue:#2F6BFF; --red:#FF4B3E; --yolk:#FFC93C; --sky:#9ED8F5;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --edge:#05090D; --panel:#223040; --text:#F2F5F8; --muted:#A9B6C4; --sky:#27445C; }
}
:root[data-theme="dark"]{ --edge:#05090D; --panel:#223040; --text:#F2F5F8; --muted:#A9B6C4; --sky:#27445C; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--text);font-family:var(--body);font-weight:800;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.sticker{background:var(--panel);border:3px solid var(--edge);border-radius:16px;box-shadow:4px 4px 0 var(--edge)}

#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none;z-index:5}
#top > *{pointer-events:auto}
.score{display:flex;border:3px solid var(--edge);border-radius:999px;overflow:hidden;box-shadow:3px 3px 0 var(--edge);font-family:var(--display);font-size:18px}
.score span{padding:4px 12px;color:#fff;white-space:nowrap}
.score .blue{background:var(--blue)} .score .red{background:var(--red)}
#phase{padding:6px 14px;font-family:var(--display);font-size:20px;text-align:center;line-height:1.1;white-space:nowrap}
#phase small{display:block;font-family:var(--body);font-size:12px;color:var(--muted)}
.right{display:flex;gap:6px;align-items:center}
.chip{background:var(--panel);border:3px solid var(--edge);border-radius:999px;padding:4px 10px;font-size:13px;box-shadow:3px 3px 0 var(--edge);text-align:left;line-height:1.15}
.chip small{display:block;color:var(--muted);font-size:11px}
.icon{width:38px;height:38px;border-radius:50%;background:var(--panel);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);font-size:17px;padding:0}

#who{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 66px);max-width:250px;padding:10px 12px;display:none;gap:10px;align-items:center;z-index:4}
#who .face{font-size:34px;line-height:1}
#who b{display:block;font-family:var(--display);font-weight:400;font-size:17px}
#who p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.3}
#who .tag,.row .tag{display:inline-block;font-size:11px;color:#fff;padding:1px 8px;border-radius:999px;margin-bottom:3px}
#wind{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 66px);padding:6px 10px;display:none;align-items:center;gap:8px;font-size:13px;z-index:4}

/* crosshair + hints */
#cross{position:fixed;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px rgba(30,42,56,.55);pointer-events:none;z-index:3;display:none}
#cross::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:#fff;border-radius:50%}
#cross.bad{border-color:var(--red)}
#lockHint{position:fixed;left:50%;top:58%;transform:translateX(-50%);padding:8px 16px;font-size:15px;z-index:6;display:none;pointer-events:none;text-align:center}
#help{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:8px 12px;font-size:12px;line-height:1.5;color:var(--muted);z-index:4;display:none;max-width:230px}
#help b{color:var(--text)}

#tray{position:fixed;left:0;right:0;bottom:0;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;justify-content:center;pointer-events:none;z-index:5}
#tray .bar{pointer-events:auto;display:flex;align-items:stretch;gap:8px;padding:8px;max-width:100%}
#side{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:5;padding:8px;display:none;width:min(370px,44vw)}
#side h2{margin:0 2px 6px;font-family:var(--display);font-weight:400;font-size:16px;line-height:1.1}
#side h2 small{font-family:var(--body);font-size:11px;color:var(--muted);margin-left:6px}
#side .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
#side .btn.sm{display:flex;align-items:center;gap:6px;width:100%;min-width:0;padding:4px 8px;font-size:12px;line-height:1.15}
#side .btn.sm .se{font-size:16px;flex:none}
#side .btn.sm .spn{flex:1;min-width:0;white-space:normal;text-align:left;line-height:1.1}
#side .btn.sm kbd{flex:none;margin-left:auto}
@media (max-width:899px), (max-height:520px){
  #side{left:8px;right:8px;width:auto;top:auto;transform:none;bottom:calc(env(safe-area-inset-bottom,0px) + 98px)}
  #side .grid{grid-template-columns:repeat(7,minmax(0,1fr))}
  #side .btn.sm{justify-content:center;padding:5px 2px;flex-direction:column;gap:1px}
  #side .btn.sm .spn{display:none}
  #side .btn.sm kbd{margin:0}
  #side h2{display:none}
}
body.touch #side{left:8px;right:8px;width:auto;top:calc(env(safe-area-inset-top,0px) + 136px);bottom:auto;transform:none}
body.touch #side .grid{grid-template-columns:repeat(7,minmax(0,1fr))}
body.touch #side .btn.sm{justify-content:center;padding:6px 2px;min-height:40px}
body.touch #side .btn.sm .spn,body.touch #side .btn.sm kbd,body.touch #side h2{display:none}
body.touch #side .btn.sm .se{font-size:20px}
@media (max-height:760px){ #help{display:none !important} }
.card{min-width:92px;padding:8px 8px 6px;border:3px solid var(--edge);border-radius:12px;background:var(--panel);text-align:center;box-shadow:3px 3px 0 var(--edge)}
.card .e{font-size:28px;line-height:1.1;display:block}
.card .n{font-family:var(--display);font-weight:400;font-size:15px;display:block}
.card .d{font-size:11px;color:var(--muted);display:block;line-height:1.2;max-width:110px}
.card .k{font-size:10px;color:var(--muted)}
.card[aria-pressed="true"]{background:var(--yolk);color:#1E2A38;transform:translateY(-6px)}
.card[aria-pressed="true"] .d,.card[aria-pressed="true"] .k{color:#1E2A38}
.btn{border:3px solid var(--edge);border-radius:999px;padding:8px 16px;background:var(--panel);box-shadow:3px 3px 0 var(--edge);font-weight:900;white-space:nowrap}
.btn.primary{background:var(--yolk);color:#1E2A38}
.btn:disabled{opacity:.4;cursor:default}
.specials{display:grid;grid-template-columns:repeat(7,auto);gap:5px;align-content:center}
.specials.defs{grid-template-columns:repeat(3,auto)}
.specials:not(.defs){grid-template-columns:repeat(10,auto)}
.specials:not(.defs) .spn{display:none}
.btn.sm{padding:3px 9px;font-size:12px;border-width:2px;box-shadow:2px 2px 0 var(--edge);text-align:left}
.btn.sm kbd{font-family:var(--body);font-size:10px;color:var(--muted);margin-left:5px}
.btn.sm.primary kbd{color:#1E2A38}
.btn:active,.card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.stack{display:flex;flex-direction:column;gap:6px;justify-content:center}
.count{font-family:var(--display);font-size:26px;line-height:1;text-align:center}
.count small{display:block;font-family:var(--body);font-size:11px;color:var(--muted)}
.ammo{display:flex;align-items:center;gap:10px;padding:0 6px}
.ammo .now{font-size:40px;line-height:1}
.ammo .next{font-size:20px;opacity:.55}
.power{width:min(220px,36vw);height:22px;border:3px solid var(--edge);border-radius:999px;overflow:hidden;background:var(--panel);align-self:center}
.power i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yolk),var(--red))}

#flash{position:fixed;inset:0;background:#FFF6D8;opacity:0;pointer-events:none;z-index:8}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 190px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:6;width:max-content;max-width:90vw}
#toast div{background:#1E2A38;color:#fff;padding:6px 14px;border-radius:999px;font-size:14px;animation:pop .25s ease-out;text-align:center}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){ #toast div{animation:none} }

#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);z-index:10;background:rgba(20,30,45,.35)}
#overlay[hidden]{display:none}
.panel{max-width:540px;width:100%;max-height:100%;overflow:auto;padding:22px 22px 18px;text-align:center}
.title{font-family:var(--display);font-weight:400;font-size:clamp(44px,11vw,84px);line-height:.95;margin:0 0 6px;color:var(--yolk);-webkit-text-stroke:3px var(--edge);paint-order:stroke fill;text-shadow:5px 5px 0 var(--edge);letter-spacing:.5px}
.title.red{color:var(--red)} .title.blue{color:var(--blue)}
.panel p{margin:6px auto;max-width:46ch;line-height:1.4}
.panel .muted{color:var(--muted);font-size:14px}
.rows{display:grid;gap:10px;margin:14px 0;text-align:left}
.row{display:flex;gap:10px;align-items:center;padding:10px;border:3px solid var(--edge);border-radius:12px}
.row .face{font-size:34px}
.row b{font-family:var(--display);font-weight:400;font-size:18px;display:block}
.row span{font-size:13px;color:var(--muted);display:block;line-height:1.3}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;text-align:left;font-size:13px;color:var(--muted);margin:14px auto 0;max-width:400px}
.keys kbd{font-family:var(--body);font-weight:900;color:var(--text);white-space:nowrap}
.bg-blue{background:var(--blue)} .bg-red{background:var(--red)}

/* touch controls */
#touchUI{display:none}
body.touch #touchUI{display:block}
#stick{position:fixed;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:130px;height:130px;border-radius:50%;border:3px solid rgba(255,255,255,.8);background:rgba(30,42,56,.25);z-index:5;pointer-events:none}
#stick i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.9);border:3px solid var(--edge)}
.tbtns{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:grid;grid-template-columns:auto auto;gap:10px;z-index:6;align-items:end}
.tb{width:64px;height:64px;border-radius:50%;border:3px solid var(--edge);background:var(--panel);box-shadow:3px 3px 0 var(--edge);font-size:12px;font-weight:900;touch-action:none;padding:0}
.tb.big{width:84px;height:84px;background:var(--yolk);color:#1E2A38;font-size:14px;grid-row:span 2}
body.touch #tray{top:calc(env(safe-area-inset-top,0px) + 58px);bottom:auto;padding-bottom:0}
body.touch #who,body.touch #help{display:none !important}
body.touch #toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 180px)}

@media (max-width:1000px){ #help{display:none !important} }
@media (max-width:640px){
  .card{min-width:70px;padding:6px 6px 4px}
  .card .d,.card .k{display:none}
  .card .e{font-size:22px}
  #phase{font-size:16px;padding:5px 10px}
  #phase small{font-size:11px}
  .score{font-size:15px}
  .score span{padding:4px 8px}
  .chip small,.chip .mn{display:none}
  .btn.sm .spn,.btn.sm kbd{display:none}
  .btn.sm{font-size:16px;padding:2px 8px}
  #top{padding-left:8px;padding-right:8px}
  .count{font-size:20px}
}

.bar .tl{font-family:var(--display);font-size:14px;writing-mode:vertical-rl;transform:rotate(180deg);align-self:center;color:var(--muted);letter-spacing:.5px}
.skills{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);gap:4px;align-content:center}
.skill{position:relative;width:min(58px, calc((100vw - 190px) / var(--cols, 15) - 4px));height:54px;padding:3px 2px 2px;border:2px solid var(--edge);border-radius:10px;background:var(--panel);box-shadow:2px 2px 0 var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;line-height:1}
.skill .si{font-size:19px;line-height:1.1;margin-top:5px}
.skill .sn{font-size:9.5px;font-weight:800;line-height:1.05;color:var(--text);text-align:center;max-width:54px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.skill kbd{position:absolute;right:2px;top:2px;min-width:14px;height:14px;padding:0 3px;border-radius:4px;background:var(--edge);color:#fff;font-family:var(--body);font-size:9px;font-weight:900;line-height:14px;text-align:center}
.skill sup{position:absolute;left:3px;top:2px;font-size:9px;font-weight:900;color:var(--muted)}
.skill[aria-pressed="true"]{background:var(--yolk);transform:translateY(-2px)}
.skill[aria-pressed="true"] .sn,.skill[aria-pressed="true"] sup{color:#1E2A38}
.skill:disabled{opacity:.3;cursor:default}
.skill:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--edge)}
@media (max-width:640px){ .skill{width:50px;height:48px} .skill .si{font-size:16px} .skill .sn{font-size:8.5px} }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Game view"></canvas>
<header id="top">
  <div class="score" aria-label="Score"><span class="blue">Blue <b id="sBlue">0</b></span><span class="red"><b id="sRed">0</b> Red</span></div>
  <div id="phase" class="sticker">Egg Defense</div>
  <div class="right">
    <div id="mapChip" class="chip" hidden></div>
    <button id="restart" class="icon" aria-label="Restart game" title="Restart game">↺</button>
    <button id="mute" class="icon" aria-label="Mute sound">🔊</button>
  </div>
</header>
<aside id="who" class="sticker"></aside>
<div id="wind" class="sticker"><span>🌪️</span><span>Strong wind</span></div>
<div id="cross"></div>
<div id="lockHint" class="sticker">Click to control your character</div>
<div id="help" class="sticker"></div>
<div id="toast" aria-live="polite"></div>
<div id="flash"></div>
<footer id="tray"></footer>
<aside id="side" class="sticker" aria-label="Powers"></aside>
<div id="touchUI">
  <div id="stick"><i></i></div>
  <div class="tbtns">
    <button class="tb" id="tGrab">Grab</button>
    <button class="tb big" id="tAct">Place</button>
    <button class="tb" id="tJump">Jump</button>
  </div>
</div>
<div id="overlay"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(() => {
'use strict';
if (!window.THREE || !window.CANNON) {
  document.getElementById('overlay').innerHTML = '<div class="panel sticker"><p>The 3D engine could not load. Check your connection and reload the page.</p></div>';
  return;
}
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

/* ---------------- random ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rand = Math.random;
const rr = (a,b) => a + rand()*(b-a);
const pick = arr => arr[Math.floor(rand()*arr.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;

/* ---------------- sound ---------------- */
let actx = null, muted = false; const lastSfx = {};
function ensureAudio(){
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(type,f0,f1,dur,vol,delay=0){
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.05);
}
let noiseBuf = null;
function noise(dur,vol,freq,ftype){
  if (!noiseBuf){ noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate); const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const t = actx.currentTime, s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = ftype; f.frequency.value = freq;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f); f.connect(g); g.connect(actx.destination); s.start(t); s.stop(t+dur+0.05);
}
const SFX = {
  fire(){ noise(.4,.55,700,'lowpass'); tone('sine',140,40,.35,.5); },
  place(){ tone('triangle',240,90,.13,.3); },
  thud(){ tone('sine',110,50,.15,.35); },
  crack(){ noise(.18,.5,3000,'highpass'); tone('square',900,200,.12,.08); },
  splat(){ noise(.7,.7,1400,'bandpass'); tone('sawtooth',420,60,.6,.18); },
  boing(){ tone('sine',160,720,.28,.3); },
  cluck(){ tone('square',950,620,.07,.1); tone('square',1050,680,.07,.1,.09); },
  quack(){ tone('sawtooth',520,380,.14,.12); },
  moo(){ tone('sawtooth',155,105,.9,.16); tone('sine',160,110,.9,.2); },
  granny(){ tone('triangle',700,1100,.18,.12); tone('triangle',1100,500,.3,.12,.18); },
  bonk(){ tone('square',320,90,.18,.18); tone('sine',900,1400,.12,.1,.05); },
  grab(){ tone('triangle',300,520,.1,.2); },
  jump(){ tone('sine',260,520,.12,.12); },
  splash(){ noise(.8,.5,600,'lowpass'); },
  hole(){ tone('sine',70,28,3,.45); noise(1.5,.4,200,'lowpass'); },
  grav(){ tone('sine',180,900,.7,.2); tone('triangle',900,180,.7,.1,.3); },
  siren(){ for (let i=0;i<3;i++){ tone('sawtooth',620,920,.35,.08,i*.4); } },
  hell(){ tone('sawtooth',80,40,1.6,.25); noise(1.4,.5,500,'lowpass'); tone('square',220,110,.8,.06,.3); },
  shinra(){ tone('sine',140,35,.9,.55); noise(.7,.55,900,'lowpass'); },
  wind(){ noise(2.6,.35,500,'bandpass'); },
  rumble(){ noise(2.4,.6,120,'lowpass'); tone('sine',50,30,2.4,.4); },
  thunder(){ noise(.15,.9,4000,'highpass'); noise(2.6,.8,200,'lowpass'); tone('sine',70,30,2,.4,.05); },
  croak(){ tone('square',180,120,.18,.12); tone('square',170,110,.2,.12,.22); },
  thunk(){ tone('triangle',420,160,.06,.12); },
  splat2(){ noise(.12,.25,1200,'bandpass'); },
  jump2(){ tone('sine',420,980,.16,.14); noise(.15,.25,3000,'highpass'); },
  dash(){ noise(.4,.65,2400,'bandpass'); tone('sine',260,1500,.2,.16); tone('sawtooth',900,200,.25,.05,.05); },
  zap(){ tone('sawtooth',1400,300,.12,.07); },
  zapHit(){ tone('sine',900,1600,.12,.12); noise(.12,.2,3000,'highpass'); },
  demon(){ tone('sawtooth',70,38,1.4,.28); noise(1.2,.5,300,'lowpass'); },
  fireball(){ noise(1.2,.7,700,'lowpass'); tone('sawtooth',200,80,.9,.14); },
  holy(){ [523,659,784,1046].forEach((f,i) => tone('sine',f,f,2.4,.07,i*.05)); },
  trumpet(){ [392,494,587].forEach((f,i) => tone('sawtooth',f,f*1.01,1.2,.05,i*.02)); },

function makeBody(def, scale){
  const g = new THREE.Group(); def.build(g); g.scale.setScalar(scale);
  const mat = def.mat === 'jelly' ? PM.jelly : def.mat === 'soft' ? PM.soft : PM.def;
  const body = new CANNON.Body({mass: def.mass * scale * scale, material: mat});
  if (def.boxes) def.boxes.forEach(b => body.addShape(new CANNON.Box(new CANNON.Vec3(b[0]*scale,b[1]*scale,b[2]*scale)), new CANNON.Vec3(b[3]*scale,b[4]*scale,b[5]*scale)));
  if (def.sph) body.addShape(new CANNON.Sphere(def.sph[0]*scale));
  if (def.sphs) def.sphs.forEach(q => body.addShape(new CANNON.Sphere(q[0]*scale), new CANNON.Vec3(q[1]*scale,q[2]*scale,q[3]*scale)));
  body.allowSleep = true; body.sleepSpeedLimit = .35; body.sleepTimeLimit = .4;
  body.linearDamping = .04; body.angularDamping = .12;
  body.tag = def.tag || null;
  return {body, mesh:g};
}

function controlPlayer(P, dt, input){
  const b = P.body;
  if (P.stun > 0) { P.stun -= dt; if (P.stun <= 0) P.stars.visible = false; P.dashT = 0; return; }
  if (P.dashT > 0) { P.dashT -= dt; const c0 = (G.warp > 0 && P === activeChar()) ? 1/G.timeScale : 1; b.velocity.x = P.dashDir.x*58*c0; b.velocity.z = P.dashDir.z*58*c0; b.velocity.y = 0; dashImpact(P); if (P.dashT <= 0) { P.dashEndFx = true; b.velocity.x *= .25; b.velocity.z *= .25; } P.naruto = true; P.moving = true; P.moveFace = Math.atan2(P.dashDir.x, P.dashDir.z); return; }
  let mx = 0, mz = 0, run = false;
  if (input) { mx = input.x; mz = input.z; run = input.run; }
  const fx = Math.sin(G.yaw), fz = Math.cos(G.yaw), rx = -Math.cos(G.yaw), rz = Math.sin(G.yaw);
  let vx = fx*mz + rx*mx, vz = fz*mz + rz*mx;
  const len = Math.hypot(vx, vz); if (len > 1) { vx /= len; vz /= len; }
  const comp = (G.warp > 0 && P === activeChar()) ? 1/G.timeScale : 1;
  const speed = (run ? 15 : 5.5) * comp;
  const ice = G.map && G.map.ice;
  const k = P.grounded ? (ice ? .04 : .3) : .07;
  b.velocity.x = lerp(b.velocity.x, vx*speed, k);
  b.velocity.z = lerp(b.velocity.z, vz*speed, k);
  if (P.grounded) P.airJumps = 0;
  if (input && G.jumpQ > 0 && P.grounded) { b.velocity.y = (G.map && G.map.grav ? 5.2 : 7) * Math.sqrt(comp); G.jumpQ = 0; sfx('jump'); P.airJumps = 0; b._onGround = false; }
  else if (input && G.jumpQ > 0 && !P.grounded && (P.airJumps || 0) < 1) { b.velocity.y = (G.map && G.map.grav ? 5.5 : 8) * Math.sqrt(comp); G.jumpQ = 0; P.airJumps = 1; doubleJumpFX(P); }
  if (len > .1) P.moveFace = Math.atan2(vx, vz);
  P.moving = len > .1;
  P.naruto = !!(run && len > .3 && !P.carry);
}

function animatePlayer(P, dt, isActive){
  const b = P.body;
  P.root.position.set(b.position.x, b.position.y, b.position.z);
  const hs = Math.hypot(b.velocity.x, b.velocity.z);
  const aiming = false;
  const acting = P.castPose > 0 || P.punchPose > 0 || P.pushPose > 0;
  let target = P.face;
  if (isActive && acting) target = G.yaw;
  else if (isActive && P.moveFace != null && P.moving) target = P.moveFace;
  else if (!isActive) target = Math.atan2(-b.position.x, -b.position.z);
  let d = target - P.face; while (d > Math.PI) d -= Math.PI*2; while (d < -Math.PI) d += Math.PI*2;
  P.face += d * Math.min(1, dt*(P.naruto ? 18 : 12));
  P.root.rotation.y = P.face;
  P.walk += dt * hs * 2.2;
  const sw = Math.sin(P.walk) * Math.min(1, hs/4) * .75;
  P.legs[0].rotation.x = sw; P.legs[1].rotation.x = -sw;
  if (P.carry) { P.arms[0].rotation.x = P.arms[1].rotation.x = -2.9; }
  else if (aiming) { P.arms[1].rotation.x = -1.5; P.arms[0].rotation.x = -1.1; P.arms[0].rotation.z = -.4; }
  else { P.arms[0].rotation.x = -sw; P.arms[1].rotation.x = sw; P.arms[0].rotation.z = 0; }
  if (!P.grounded && !P.carry && !aiming) { P.arms[0].rotation.z = .6; P.arms[1].rotation.z = -.6; } else P.arms[1].rotation.z = 0;
  if (P.castPose > 0) { P.castPose -= dt; P.arms[0].rotation.x = P.arms[1].rotation.x = -2.6; P.arms[0].rotation.z = .3; P.arms[1].rotation.z = -.3; }
  if (P.punchPose > 0) { P.punchPose -= dt; P.arms[1].rotation.x = -1.57; P.arms[1].rotation.z = 0; P.arms[0].rotation.x = .6; }
  if (P.pushPose > 0) { P.pushPose -= dt; P.arms[1].rotation.x = -1.6; P.arms[1].rotation.z = 0; }
  P.baz.visible = false;
  if (aiming) P.baz.rotation.x = -G.pitch * .8;
  if (P.stun > 0) { P.rig.rotation.z = Math.sin(G.t*9)*.35; P.rig.rotation.x = Math.sin(G.t*7)*.2; P.stars.rotation.y += dt*6; }
  else { P.rig.rotation.z *= .8; P.rig.rotation.x *= .8; }

function spawnEgg(h){
  const g = new THREE.Group();
  const shell = sp(.33, new THREE.MeshStandardMaterial({color:0xFFF3DC, roughness:.5, flatShading:true}), 0,0,0,g,2);
  shell.scale.set(1,1.3,1);
  const crackG = new THREE.Group(); g.add(crackG);
  const body = new CANNON.Body({mass:.6, material:PM.egg});
  body.addShape(new CANNON.Sphere(.33));
  body.position.set(0, h + .34, 0);
  body.linearDamping = .1; body.angularDamping = .7;
  body.allowSleep = true; body.sleepSpeedLimit = .1; body.sleepTimeLimit = .5;
  body.tag = 'egg';
  addOutline(g);
  egg = addObj({body, mesh:g, kind:'egg', bottom:.43});
  Object.assign(egg, {cracks:0, alive:true, grace:1.2, pending:null, crackG, crackCd:0});
  body.addEventListener('collide', e => {
    if (!egg.alive || egg.grace > 0 || egg.pending) return;
    let v = Math.abs(e.contact.getImpactVelocityAlongNormal());
    const other = e.body;
    if (other && (other.tag === 'mattress' || other.tag === 'soft')) v *= .35;
    if (other && other.tag === 'jelly') v *= .6;
    const hard = G.defChar && G.defChar.def.eggHard || 1;
    const thr = 3.1 * hard * (G.eggArmor || 1) * [1, .72, .5][egg.cracks];
    if (v > thr) egg.pending = {type:'break', other};
    else if (v > thr * .55 && egg.crackCd <= 0) egg.pending = {type:'crack', other};
  });
}
function addCrack(){
  egg.cracks = Math.min(2, egg.cracks + 1); egg.crackCd = .5;
  for (let i=0;i<3;i++){
    const l = bx(.03,.22,.03,0x3B2A1A,0,0,0,egg.crackG); const a = rr(0,Math.PI*2), y = rr(-.2,.25);
    l.position.set(Math.cos(a)*.33, y, Math.sin(a)*.33); l.rotation.set(rr(-.8,.8),a,rr(-.8,.8)); l.castShadow = false;
  }
  sfx('crack'); toast(egg.cracks === 1 ? 'Hairline crack! The egg is weaker now.' : 'Another crack. One more good hit.');
}
function breakEgg(reason){

  if (G.eggLives > 0 && reason !== 'worldend' && G.phase === 'attack') { saveEgg(); return; }
  egg.alive = false;

  removeObj(egg);

  const legs = [-1,1].map(s => { const lg = new THREE.Group(); bx(.16,.52,.16,sock,0,0,0,lg); bx(.18,.08,.24,0x3A2A1E,0,-.26,.04,lg); return part(new CANNON.Box(new CANNON.Vec3(.08,.26,.08)), .5, lg, [s*.1,-.57,0]); });
  const cons = [];

function warpMaterial(){

    uniforms:{t:{value:0}, a:{value:1}},
    vertexShader:'varying vec2 vUv; uniform float t; void main(){ vUv = uv; vec3 p = position; float r = length(uv - .5); p.z += sin(r*18.0 - t*14.0) * .45 * (1.0 - r); gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }',
    fragmentShader:'varying vec2 vUv; uniform float t; uniform float a; void main(){ float r = length(vUv - .5) * 2.0; float ring = .5 + .5*sin(r*24.0 - t*18.0); float edge = smoothstep(1.0, .55, r); vec3 c = mix(vec3(.5,.75,1.0), vec3(.9,.6,1.0), ring); gl_FragColor = vec4(c, (ring*.6 + .15) * edge * .5 * a); }'

}

    const ep = new THREE.Vector3(egg.body.position.x, egg.body.position.y, egg.body.position.z);
    const dd = ep.clone().sub(origin); const dist = dd.length(); dd.normalize();
    occRay.set(origin, dd); occRay.far = Math.max(.1, dist - .45);
    const skip = new Set([egg.mesh, chars.blue && chars.blue.root, chars.red && chars.red.root, G.pedMesh]);
    const hits = occRay.intersectObjects(roundGroup.children.filter(c => !skip.has(c) && !c.userData.noRay), true);
    if (hits.length) eggFactor = .25;

    const dx = b.position.x - origin.x, dz = b.position.z - origin.z;

    let dv = 24*(1 - Math.max(0,f)/L) + 7;

    if (b.wakeUp) b.wakeUp();
    const spread = (dx*side.x + dz*side.z) > 0 ? .12 : -.12;
    b.velocity.x += (dir.x + side.x*spread)*dv; b.velocity.z += (dir.z + side.z*spread)*dv; b.velocity.y += dv*.22 + 1.2;

    if (b.player) { b.player.stun = Math.max(b.player.stun, 1.4); b.player.stars.visible = true; }
  }
  if (domeUp() && !inDome(origin)) { const ddx = G.dome.c.x - origin.x, ddz = G.dome.c.z - origin.z, ff = ddx*dir.x + ddz*dir.z, ll = Math.abs(ddx*side.x + ddz*side.z); if (ff > -1.5 && ff < L && ll < 4.5 + Math.max(0,ff)*.22 + G.dome.R) hurtDome(18*(1 - Math.max(0,ff)/L) + 6); }

  const bubble = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 18), warpMaterial()); bubble.position.copy(origin); bubble.userData.noRay = true; roundGroup.add(bubble);
  const ripple = new THREE.Mesh(new THREE.RingGeometry(.8,1.3,48), bmat(0xFFFFFF,.6)); ripple.rotation.x = -Math.PI/2; ripple.position.set(origin.x, at.y + .07, origin.z); ripple.userData.noRay = true; roundGroup.add(ripple);
  booms.push({t:0, parts:[...walls, bubble, ripple], custom(b){
    const t = b.t;
    walls.forEach(w => { const tt = Math.max(0, t - w.userData.delay); w.visible = t >= w.userData.delay; w.position.copy(origin).addScaledVector(dir, tt*32); w.scale.set(1 + tt*2.2, 1 + tt*1.1, 1); w.material.uniforms.t.value = tt; w.material.uniforms.a.value = Math.max(0, 1 - tt/.95); });
    bubble.scale.setScalar(1 + t*6); bubble.material.uniforms.t.value = t; bubble.material.uniforms.a.value = Math.max(0, 1 - t/.6);

  }});

}

    } else {

      v.fade = (v.fade || 0) + dt;

  const reach = r*1.45;
  const i0 = Math.max(1, Math.floor((p.x - reach + ISL)/TES)), i1 = Math.min(TN - 2, Math.ceil((p.x + reach + ISL)/TES));
  const j0 = Math.max(1, Math.floor((p.z - reach + ISL)/TES)), j1 = Math.min(TN - 2, Math.ceil((p.z + reach + ISL)/TES));
  if (i0 > i1 || j0 > j1) return;
  const home = eggHome();
  for (let j=j0;j<=j1;j++) for (let i=i0;i<=i1;i++){
    const v = i + j*TN, x = -ISL + i*TES, z = -ISL + j*TES, d = Math.hypot(x - p.x, z - p.z);
    if (d > reach) continue;

    let dh = d < r ? -depth*(1 - (d/r)*(d/r)) : depth*.25*(1 - (d - r)/(reach - r));

    if (o.maskT != null) { o.maskT -= rdt; if (o.maskT <= 0) { o.maskT = null; if (o.gran) { o.body.collisionFilterMask = 1 | GRP_CHAR; o.parts.forEach(p => p.body.collisionFilterMask = 1 | GRP_CHAR); } else o.body.collisionFilterMask = -1; } }
    if (o.thrownT != null) { o.thrownT -= rdt; if (o.thrownT <= 0) { o.thrownT = null; if (o.kind !== 'proj') o.body.proj = false; } }
    if (isCarried(o) || o.grabbed) continue;
    o.mesh.position.copy(o.body.position); o.mesh.quaternion.copy(o.body.quaternion);
    if (o.parts) for (const p of o.parts) { p.mesh.position.copy(p.body.position); p.mesh.quaternion.copy(p.body.quaternion); }
    if (o.wobble) { o.wobble = Math.max(0, o.wobble - rdt*1.6); const s = 1 + Math.sin(G.t*38)*.09*o.wobble; o.mesh.scale.set(s, 2-s, s); }
    if (o.burstPending) { o.burstPending = false; burstMelon(o); continue; }
    if (updateSpecialProjectile(o, rdt)) continue;
    if (o.kind === 'proj') { o.life += rdt * (G.freeze > 0 ? 0 : 1); if (o.life > 35) removeObj(o); }
    if (o.body.position.y < -14) removeObj(o);
  }
  if (objs.length > 80) objs = objs.filter(o => !o.dead);
  for (const f of fx) {
    if (f.life <= 0) continue;
    const d = rdt * G.fxScale; f.life -= rdt * (G.freeze > 0 ? 0 : 1);
    f.v.y -= 12*d; f.mesh.position.addScaledVector(f.v, d);
    f.mesh.rotation.x += f.r.x*d; f.mesh.rotation.y += f.r.y*d;
    const fgh = groundH(f.mesh.position.x, f.mesh.position.z); if (f.mesh.position.y < fgh + .05) { f.mesh.position.y = fgh + .05; f.v.multiplyScalar(.4); f.v.y = Math.abs(f.v.y)*.3; }
    if (f.life <= 0) roundGroup.remove(f.mesh);
  }
  updateBooms(G.freeze > 0 ? 0 : rdt); updateHoles(rdt * G.fxScale); updateComets(rdt * G.fxScale); updateSkels(rdt * G.fxScale); updateTornados(rdt * G.fxScale); updateVolcanoes(rdt * G.fxScale); updateBolts(rdt * G.fxScale); updateGiantCows(rdt * G.fxScale); updateFrogs(rdt * G.fxScale); updateStorms(rdt * G.fxScale); updateDome(rdt); updateTurrets(rdt * G.fxScale); updateHands(rdt * G.fxScale); updateFireballs(rdt * G.fxScale); updateJudgements(rdt * G.fxScale); updateComings(rdt * G.fxScale); updateCombo(rdt * G.fxScale); updateSky(G.freeze > 0 ? 0 : rdt); updateSatans(rdt * G.fxScale); updateSwords(rdt * G.fxScale); updateTrees(); updateNovas(rdt * G.fxScale); updateVacs(rdt * G.fxScale); updateEvas(rdt * G.fxScale); updateDefenses2(rdt * G.fxScale); updateCombos(rdt * G.fxScale); updatePunches(rdt * G.fxScale); outlineSweep(rdt); updateMarkerFX(rdt);
  for (const o of objs) if (o.popPending && !o.dead) popDecoy(o); updateGravity(rdt);
  if (fx.length > 300) fx = fx.filter(f => f.life > 0);
  // players: animate, fall into sea
  for (const t of ['blue','red']) {
    const P = chars[t]; if (!P) continue;
    animatePlayer(P, rdt, P === act);
    if (P.body.position.y < -9) {
      if (P.carry) { const c = P.carry; P.carry = null; if (c === egg) breakEgg('sea'); else removeObj(c); }
      P.body.position.set(P.spawn.x, 3, P.spawn.z); P.body.velocity.set(0,0,0); sfx('splash');
      toast(`${P.cdef.name} fell in the sea and swam back.`);
    }
  }

  // phase logic
  if (G.phase === 'attack') {
    G.cooldown -= rdt;
    if (G.charging) { G.power += G.pdir * rdt * .85; if (G.power >= 1) { G.power = 1; G.pdir = -1; } if (G.power <= 0) { G.power = 0; G.pdir = 1; } }
    const pw = $('pw'); if (pw) pw.style.width = (G.power*100).toFixed(1) + '%';
    G.spCd -= rdt;
    if (G.atkTime > 0) {
      G.atkTime -= rdt;
      if (G.atkTime <= 0) { G.charging = false; toast("Time's up! Waiting for the dust to settle…"); }
    } else if (egg && egg.alive) {
      const moving = objs.some(o => !o.dead && o.kind !== 'egg' && !isCarried(o) && o.body.velocity.norm() > 1.2);
      G.endTimer += rdt;
      if ((G.endTimer > 4 && !moving && !effectsActive()) || G.endTimer > 12) endRound(G.defender, 'held', false);
    }
  }

  // camera
  const cross = $('cross');
  if (inPlay() && act) {
    const bp = act.body.position;
    const cp = Math.cos(G.pitch), f3 = tmpA.set(Math.sin(G.yaw)*cp, Math.sin(G.pitch), Math.cos(G.yaw)*cp);
    const right = tmpB.set(-Math.cos(G.yaw), 0, Math.sin(G.yaw));
    const piv = tmpL.set(bp.x, bp.y + 1.75, bp.z).addScaledVector(right, .75);
    const dist = G.phase === 'attack' ? G.camDist*.85 : G.camDist;
    tmpV.copy(piv).addScaledVector(f3, -dist);
    { const cg = Math.max(groundH(tmpV.x, tmpV.z), groundH((tmpV.x + bp.x)/2, (tmpV.z + bp.z)/2)) + .6; if (tmpV.y < cg) tmpV.y = cg; }
    camPos.lerp(tmpV, 1 - Math.pow(.0005, rdt));
    camera.position.copy(camPos);
    camLook.copy(camPos).addScaledVector(f3, 20);
    cross.style.display = 'block';
  } else {
    cross.style.display = 'none';
    if (G.phase === 'title') { const a = G.t*.08; tmpV.set(Math.sin(a)*30, 14, Math.cos(a)*30); tmpL.set(0,1,0); }
    else if (G.eggCam && G.eggPos) { tmpL.copy(G.eggPos); tmpV.copy(G.eggPos).add(new THREE.Vector3(Math.sin(G.t*.3)*3.6, 2.4, Math.cos(G.t*.3)*3.6)); }
    else { const a = G.t*.12; tmpV.set(Math.sin(a)*20, 10, Math.cos(a)*20); tmpL.set(0,1,0); }
    const k = 1 - Math.pow(.02, rdt);
    camPos.lerp(tmpV, k); camLook.lerp(tmpL, k);
    camera.position.copy(camPos);
  }
  if (G.shake > 0 && !reduceMotion) { G.shake -= rdt; const s = G.shake*.3; camera.position.x += rr(-s,s); camera.position.y += rr(-s,s); }
  { const A = activeChar(); G.fovKick = Math.max(0, (G.fovKick || 0) - rdt*3); G.dashCd = (G.dashCd || 0) - rdt; const want = (G.baseFov || 55) + (A && A.nrk > .5 ? 12*A.nrk : 0) + G.fovKick*14; if (Math.abs(camera.fov - want) > .05) { camera.fov = lerp(camera.fov, want, Math.min(1, rdt*6)); camera.updateProjectionMatrix(); } }
  camera.lookAt(camLook);
  G.roll = lerp(G.roll || 0, G.flip > 0 ? Math.PI : 0, Math.min(1, rdt*2.5)); if (Math.abs(G.roll) > .002) camera.rotateZ(G.roll);
  camera.updateMatrixWorld();
  { const f = act ? act.body.position : camLook; sun.position.set(f.x + 18, 30, f.z + 12); sun.target.position.set(f.x, 0, f.z); sun.target.updateMatrixWorld(); }

  // eggcam: keep the slow-mo break visible even mid-play
  if (G.eggCam && G.eggPos && G.phase !== 'end' && G.slowmo > 0) {
    tmpV.copy(G.eggPos).add(new THREE.Vector3(3, 2.4, 3)); camera.position.lerp(tmpV, .9); camera.lookAt(G.eggPos); cross.style.display = 'none';
  }

  G.fc = (G.fc || 0) + 1;
  if (G.fc % 2 === 0) { if (G.phase === 'build') updateGhost(); updateTargeting(); }
  // trajectory preview
  if (G.dots) {
    const P = chars[attacker()];
    const show = G.phase === 'attack' && P && !P.carry && P.stun <= 0 && false;
    if (show) {
      const {m, dir} = muzzleAndDir(P);
      const key = G.armed || G.ammo[0]; const sp0 = launchSpeed(key, G.charging ? Math.max(.12, G.power) : .55);
      const gy = world.gravity.y * (1 - (G.atkChar.atk.antigrav||0));
      G.dots.forEach((d,i) => { const t = (i+1)*.07; d.visible = true; d.position.set(m.x + dir.x*sp0*t, m.y + dir.y*sp0*t + .5*gy*t*t, m.z + dir.z*sp0*t); });
    } else if (!(G.targeting && THROWN.has(G.targeting) && G.targetPoint)) G.dots.forEach(d => d.visible = false);
    updateThrowArc();
  }
  zoneRing.visible = G.phase === 'build' || G.phase === 'attack' || G.phase === 'intro';
  zoneRing.material.color.set(G.phase === 'attack' ? 0xFF8A80 : 0xffffff);
  $('lockHint').style.display = (inPlay() && !isTouch && !G.locked && !G.fallback && !G.eggCam) ? 'block' : 'none';
  updateVisuals(rdt); updateEdge();
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

/* ---------------- title ---------------- */
function showTitle(){
  overlay(`<div class="panel sticker">
    <div class="title">Egg Defense</div>
    <p>One team protects a giant egg with 19 protection powers, from forcefields and laser turrets to stone golems and a guardian angel. Attackers get 29 skills they can drop anywhere and spam as much as they like, from nukes and black holes to a milk-spraying giant cow, and skills that fuse into combos. Then you swap sides.</p>
    <p class="muted">Two players, one screen, taking turns. Every round rolls a new map, weather and a random character with a trait for each side.</p>
    <div class="actions"><button class="btn primary" id="startB">Start round 1</button></div>
    ${isTouch ? '<p class="muted">Left thumb moves, drag on the right to look. Buttons do the rest.</p>' : `<div class="keys">
      <kbd>WASD</kbd><span>Move (Shift to run)</span>
      <kbd>Mouse</kbd><span>Look around</span>
      <kbd>Space</kbd><span>Jump</span>
      <kbd>Click</kbd><span>Place an item, or hold and release to fire</span>
      <kbd>1–3, scroll</kbd><span>Pick an item</span>
      <kbd>R</kbd><span>Rotate the item</span>
      <kbd>E</kbd><span>Pick up or put down things (even the egg). Click to throw.</span>
      <kbd>F</kbd><span>Done building</span>
    </div>`}
  </div>`);
  $('startB').onclick = startGame; $('startB').focus();
}
G.defender = 'blue';
buildRound(12345); G.phase = 'title';

G.map = null; renderScore(); renderPhase(); showTitle();
})();
</script>
